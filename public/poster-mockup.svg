<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1700 1200" role="img" aria-labelledby="title desc">
  <title id="title">Образец ручной стенгазеты «Гимназия 122 — город 17 чудес»</title>
  <desc id="desc">Композиционный макет горизонтального ватмана 85 на 60 сантиметров. Три зоны для фотографий и QR-код являются примером, а не готовой стенгазетой.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f4ead5"/><stop offset="1" stop-color="#e8d8b9"/></linearGradient>
    <linearGradient id="river" x2="0" y2="1"><stop stop-color="#8fb7ac"/><stop offset="1" stop-color="#4e8180"/></linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r=".8" fill="#846f50" opacity=".09"/><circle cx="21" cy="18" r=".7" fill="#846f50" opacity=".08"/></pattern>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Arial,sans-serif}.hand{font-family:'Comic Sans MS','Segoe Print',cursive}
      .ink{fill:#17303b}.muted{fill:#536b68}.gold{fill:#b87939}.line{stroke:#b87939;stroke-opacity:.45}
    </style>
  </defs>
  <rect width="1700" height="1200" fill="url(#paper)"/><rect width="1700" height="1200" fill="url(#grain)"/>
  <rect x="35" y="35" width="1630" height="1130" rx="9" fill="none" stroke="#31545a" stroke-width="4"/><rect x="48" y="48" width="1604" height="1104" rx="6" fill="none" stroke="#b87939" stroke-width="1.5"/>
  <path d="M84 86h1532" class="line" stroke-width="2"/><path d="M84 225h1532" class="line" stroke-width="2"/>
  <text x="850" y="135" text-anchor="middle" class="serif ink" font-size="51" letter-spacing="1">Гимназия 122 — город 17 чудес</text>
  <text x="850" y="184" text-anchor="middle" class="hand gold" font-size="27">Мечтай! Действуй! Россия начинается с нас</text>
  <text x="850" y="211" text-anchor="middle" class="sans muted" font-size="15">Однажды гимназия стала волшебным городом. Семнадцать огней начали гаснуть — 9А отправляется вернуть свет поступками.</text>

  <g transform="translate(82 270)">
    <text x="0" y="0" class="serif ink" font-size="22">17 чудес города</text>
    <g class="sans ink" font-size="16">
      <text x="0" y="43"><tspan class="gold">01</tspan><tspan dx="12">Жизнь</tspan></text><text x="0" y="83"><tspan class="gold">02</tspan><tspan dx="12">Достоинство</tspan></text><text x="0" y="123"><tspan class="gold">03</tspan><tspan dx="12">Права и свободы человека</tspan></text><text x="0" y="163"><tspan class="gold">04</tspan><tspan dx="12">Патриотизм</tspan></text><text x="0" y="203"><tspan class="gold">05</tspan><tspan dx="12">Гражданственность</tspan></text><text x="0" y="243"><tspan class="gold">06</tspan><tspan dx="12">Служение Отечеству</tspan></text><text x="0" y="283"><tspan class="gold">07</tspan><tspan dx="12">Высокие нравственные идеалы</tspan></text><text x="0" y="323"><tspan class="gold">08</tspan><tspan dx="12">Крепкая семья</tspan></text><text x="0" y="363"><tspan class="gold">09</tspan><tspan dx="12">Созидательный труд</tspan></text>
      <text x="1195" y="43"><tspan class="gold">10</tspan><tspan dx="12">Приоритет духовного над материальным</tspan></text><text x="1195" y="83"><tspan class="gold">11</tspan><tspan dx="12">Гуманизм</tspan></text><text x="1195" y="123"><tspan class="gold">12</tspan><tspan dx="12">Милосердие</tspan></text><text x="1195" y="163"><tspan class="gold">13</tspan><tspan dx="12">Справедливость</tspan></text><text x="1195" y="203"><tspan class="gold">14</tspan><tspan dx="12">Коллективизм</tspan></text><text x="1195" y="243"><tspan class="gold">15</tspan><tspan dx="12">Взаимопомощь и взаимоуважение</tspan></text><text x="1195" y="283"><tspan class="gold">16</tspan><tspan dx="12">Историческая память и преемственность</tspan></text><text x="1195" y="323"><tspan class="gold">17</tspan><tspan dx="12">Единство народов России</tspan></text>
    </g>
    <text x="0" y="411" class="sans muted" font-size="12">Полные формулировки — в проекте и пункте 5 Указа № 809.</text>
  </g>

  <g transform="translate(480 268)">
    <path d="M0 45Q80 5 175 42T350 30Q450 2 532 48T700 40V390Q613 427 526 392T349 404Q220 429 132 395T0 410Z" fill="#d9d9bd" stroke="#749087" stroke-width="2"/>
