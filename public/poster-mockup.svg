    <path d="M-18 248C90 135 126 360 238 244S378 124 458 233 580 354 650 233 731 134 754 179" fill="none" stroke="#f2dfb9" stroke-width="1.5" stroke-dasharray="5 7"/>
    <path d="M30 98Q200 50 300 101T650 83M26 341Q170 278 316 341T674 322" fill="none" stroke="#a8774a" stroke-width="2" stroke-dasharray="4 9"/>
