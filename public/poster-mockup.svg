      <g><circle cx="56" cy="104" r="20"/><text x="56" y="109" fill="#17303b" stroke="none">01</text></g><g><circle cx="170" cy="73" r="20"/><text x="170" y="78" fill="#17303b" stroke="none">02</text></g><g><circle cx="280" cy="99" r="20"/><text x="280" y="104" fill="#17303b" stroke="none">03</text></g><g><circle cx="402" cy="75" r="20"/><text x="402" y="80" fill="#17303b" stroke="none">04</text></g><g><circle cx="536" cy="98" r="20"/><text x="536" y="103" fill="#17303b" stroke="none">05</text></g><g><circle cx="649" cy="73" r="20"/><text x="649" y="78" fill="#17303b" stroke="none">06</text></g>
      <g><circle cx="105" cy="212" r="20"/><text x="105" y="217" fill="#17303b" stroke="none">07</text></g><g><circle cx="215" cy="192" r="20"/><text x="215" y="197" fill="#17303b" stroke="none">08</text></g><g><circle cx="330" cy="219" r="20"/><text x="330" y="224" fill="#17303b" stroke="none">09</text></g><g><circle cx="453" cy="197" r="20"/><text x="453" y="202" fill="#17303b" stroke="none">10</text></g><g><circle cx="565" cy="217" r="20"/><text x="565" y="222" fill="#17303b" stroke="none">11</text></g><g><circle cx="675" cy="198" r="20"/><text x="675" y="203" fill="#17303b" stroke="none">12</text></g>
      <g><circle cx="61" cy="331" r="20"/><text x="61" y="336" fill="#17303b" stroke="none">13</text></g><g><circle cx="178" cy="359" r="20"/><text x="178" y="364" fill="#17303b" stroke="none">14</text></g><g><circle cx="298" cy="348" r="20"/><text x="298" y="353" fill="#17303b" stroke="none">15</text></g><g><circle cx="432" cy="363" r="20"/><text x="432" y="368" fill="#17303b" stroke="none">16</text></g><g><circle cx="559" cy="343" r="20"/><text x="559" y="348" fill="#17303b" stroke="none">17</text></g>
    </g>
    <g fill="#f2bd70"><circle cx="56" cy="104" r="3"/><circle cx="170" cy="73" r="3"/><circle cx="280" cy="99" r="3"/><circle cx="402" cy="75" r="3"/><circle cx="536" cy="98" r="3"/><circle cx="649" cy="73" r="3"/><circle cx="105" cy="212" r="3"/><circle cx="215" cy="192" r="3"/><circle cx="330" cy="219" r="3"/><circle cx="453" cy="197" r="3"/><circle cx="565" cy="217" r="3"/><circle cx="675" cy="198" r="3"/><circle cx="61" cy="331" r="3"/><circle cx="178" cy="359" r="3"/><circle cx="298" cy="348" r="3"/><circle cx="432" cy="363" r="3"/><circle cx="559" cy="343" r="3"/></g>
    <path d="M238 121v48m-12-16 12 16 12-16M453 233v25m-11-10 11 10 11-10" fill="none" stroke="#9a693f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M84 756h1532" class="line" stroke-width="2"/>
  <text x="82" y="803" class="serif ink" font-size="25">Город меняется, когда мы действуем вместе</text>
  <text x="82" y="836" class="sans muted" font-size="14">Проект учеников 9А класса гимназии № 122 имени Ж. А. Зайцевой · Казань</text>
  <g fill="none" stroke="#a47d53" stroke-width="2">
    <rect x="83" y="874" width="314" height="193" rx="4"/><rect x="420" y="874" width="314" height="193" rx="4"/><rect x="757" y="874" width="314" height="193" rx="4"/>
  </g>
  <g class="serif muted" font-size="16" text-anchor="middle"><text x="240" y="971">Фото общего дела</text><text x="577" y="971">Фото 9А</text><text x="914" y="971">Фото события</text></g>
  <text x="83" y="1097" class="sans muted" font-size="12">Фото добавить после согласования и подтверждения разрешений.</text>
  <g transform="translate(1278 856)"><rect width="174" height="174" fill="#fffaf0" stroke="#9b7048" stroke-width="2"/><image href="./site-qr.svg" x="8" y="8" width="158" height="158"/><text x="87" y="198" class="sans ink" font-size="12" text-anchor="middle">Открыть сказку</text></g>
  <text x="1511" y="1111" class="serif gold" font-size="16">Мечтай · Действуй · Береги</text>
  <text x="850" y="1138" text-anchor="middle" class="sans muted" font-size="10">Цифровой образец: по условиям конкурса бумажную стенгазету следует оформить вручную.</text>
</svg>
